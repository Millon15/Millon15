name: Refresh profile card

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate cards from public GitHub profile
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1 release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: Millon15
          AUTO_PUSH: false
          ANIMATION: none

      - name: Keep and validate the two profile-detail themes
        run: python3 scripts/select-profile-cards.py

      - name: Store validated images for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-cards
          path: profile-summary-card-output/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Retrieve validated images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-cards
          path: profile-summary-card-output/

      - name: Revalidate images before commit
        run: python3 scripts/select-profile-cards.py --check-only

      - name: Commit refreshed images
        shell: bash
        run: |
          set -euo pipefail
          git add -- profile-summary-card-output
          if git diff --cached --quiet; then
            echo 'No card changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile summary card'
          git push origin HEAD:main
