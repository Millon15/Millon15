name: Refresh profile card

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-cards.yml
      - scripts/select-profile-cards.py
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate cards from public GitHub profile
        uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1 release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: Millon15
          NAME: Vitautas Brazas
          AUTO_PUSH: false

      - name: Keep and validate the two profile-detail themes
        run: python3 scripts/select-profile-cards.py

      - name: Store validated images for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-cards
          path: profile-summary-card-output/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retrieve validated images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-cards
          path: profile-summary-card-output/

      - name: Revalidate images before commit
        run: python3 scripts/select-profile-cards.py --check-only

      - name: Commit refreshed images
        shell: bash
        run: |
          set -euo pipefail
          git add -- profile-summary-card-output
          if git diff --cached --quiet; then
            echo 'No card changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile summary card'
          git push origin HEAD:main
